<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3MR ❤️ Roa</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-deep: #0f0508;
            --card-bg: rgba(26, 10, 16, 0.85);
            --card-border: rgba(212, 175, 55, 0.25);
            --accent-red: #8B0000;
            --rose-gold: #e8a598;
            --bright-red: #d62828;
            --gold: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-main: #fff5f5;
            --text-sub: #d1b8c0;
            --radius-lg: 18px;
            --radius-md: 12px;
            --font-main: 'Tajawal', sans-serif;
            --font-title: 'Amiri', serif;
            --sab: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow: hidden;
            position: fixed;
            inset: 0;
        }

        #hearts-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
            background: radial-gradient(circle at center, rgba(40, 10, 20, 0.8) 0%, var(--bg-deep) 100%);
        }

        .hidden { display: none !important; }

        /* Splash Screen */
        #splash-screen {
            z-index: 9999;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: var(--bg-deep);
        }

        .splash-card {
            padding: 30px;
            border-radius: var(--radius-lg);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
        }

        .splash-title {
            font-family: var(--font-title);
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .splash-sub {
            font-size: 1rem;
            color: var(--rose-gold);
        }

        /* Login Screen */
        #login-screen {
            z-index: 8000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 25px;
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .login-box h2 {
            font-family: var(--font-title);
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .login-box p {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--rose-gold);
            margin-bottom: 4px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(10, 3, 6, 0.8);
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus { border-color: var(--gold); }

        .btn {
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-md);
            border: none;
            background: linear-gradient(135deg, var(--accent-red), var(--bright-red));
            color: #fff;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-gold {
            background: linear-gradient(135deg, #b8860b, var(--gold));
            color: #000;
        }

        /* App Screen */
        #app-screen {
            z-index: 100;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
        }

        .app-header {
            height: 55px;
            background: rgba(15, 5, 8, 0.95);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            flex-shrink: 0;
        }

        .header-title {
            font-family: var(--font-title);
            font-size: 1.3rem;
            color: var(--gold);
        }

        .icon-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.2);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .app-tabs {
            height: 48px;
            background: rgba(10, 3, 6, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-shrink: 0;
        }

        .tab-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-item.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            font-weight: 700;
        }

        .app-views {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .view-content {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: none !important;
            flex-direction: column;
            overflow: hidden;
        }

        .view-content.active { display: flex !important; }

        /* Chat View */
        #chat-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .msg-wrapper.me { align-self: flex-start; }
        .msg-wrapper.them { align-self: flex-end; }

        .msg-header {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 2px;
            font-size: 0.7rem;
            color: var(--rose-gold);
        }

        .msg-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--gold);
        }

        .msg-bubble {
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }

        .msg-wrapper.me .msg-bubble {
            background: linear-gradient(135deg, #500a12, #800e1b);
            border: 1px solid rgba(214, 40, 40, 0.3);
            color: #fff;
            border-top-right-radius: 2px;
        }

        .msg-wrapper.them .msg-bubble {
            background: linear-gradient(135deg, #1c1018, #2a1522);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-top-left-radius: 2px;
        }

        .msg-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 5px;
            display: block;
        }

        .msg-quote {
            background: rgba(0,0,0,0.3);
            border-right: 3px solid var(--gold);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            margin-top: 3px;
        }

        .chat-controls-area {
            flex-shrink: 0;
            background: rgba(12, 4, 8, 0.98);
            border-top: 1px solid var(--card-border);
            padding: 8px 10px calc(8px + var(--sab)) 10px;
        }

        .typing-indicator-bar {
            height: 16px;
            font-size: 0.75rem;
            color: var(--rose-gold);
            font-style: italic;
        }

        .reply-preview-box {
            display: none;
            background: rgba(40, 10, 20, 0.8);
            border-right: 3px solid var(--gold);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }

        .chat-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-input-row input {
            flex: 1;
            margin: 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.25);
            padding: 10px 12px;
            border-radius: 20px;
        }

        .attach-btn, .send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            border: none;
        }

        .attach-btn {
            background: rgba(255,255,255,0.08);
            color: var(--rose-gold);
            border: 1px solid rgba(212,175,55,0.2);
            font-size: 1rem;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: #000;
            font-size: 1rem;
        }

        /* Stories View */
        #stories-view {
            padding: 12px;
            overflow-y: auto;
        }

        .story-actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .story-create-btn {
            flex: 1;
            padding: 10px;
            background: rgba(26, 10, 16, 0.8);
            border: 1px dashed var(--gold);
            border-radius: var(--radius-md);
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .stories-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .story-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            position: relative;
        }

        .story-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .story-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid var(--gold);
            object-fit: cover;
        }

        .story-author {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--gold);
        }

        .story-time {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-right: auto;
        }

        .story-body {
            font-size: 0.95rem;
            color: var(--text-main);
            white-space: pre-wrap;
        }

        .story-media {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }

        .delete-btn {
            background: rgba(214, 40, 40, 0.2);
            border: 1px solid var(--bright-red);
            color: #ff8888;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-right: 5px;
        }

        /* Profile View */
        #members-view {
            padding: 12px;
            overflow-y: auto;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .profile-avatar-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            position: relative;
            cursor: pointer;
        }

        .profile-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
        }

        .profile-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .golden-crown-badge {
            display: inline-block;
            background: rgba(212,175,55,0.2);
            border: 1px solid var(--gold);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--gold);
        }

        .admin-box {
            background: rgba(40, 10, 20, 0.9);
            border: 1px solid var(--gold);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 15px;
        }

        .admin-box h4 {
            color: var(--gold);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .user-card-item {
            background: rgba(20, 8, 14, 0.6);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ec4b6; }
        .offline-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }

        .marquee-footer {
            height: 30px;
            background: linear-gradient(90deg, #300008, #600010, #300008);
            border-top: 1px solid var(--gold);
            overflow: hidden;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: marquee 16s linear infinite;
            font-family: var(--font-title);
            font-size: 0.95rem;
            color: var(--gold);
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .flex-row { display: flex; gap: 8px; align-items: center; }
        .mt-10 { margin-top: 10px; }
    </style>
</head>
<body>

    <canvas id="hearts-canvas"></canvas>

    <!-- Splash Screen -->
    <div id="splash-screen" class="screen">
        <div class="splash-card">
            <h1 class="splash-title">3MR ❤️ Roa</h1>
            <p class="splash-sub">عالمنا الخاص الفاخر</p>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="screen hidden">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <p>أدخل اسم المستخدم والكود للعبور</p>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="login-username" placeholder="3MR أو Roa">
            </div>
            <div class="input-group">
                <label>الكود الخفي</label>
                <input type="password" id="login-code" placeholder="••••••••">
            </div>
            <button class="btn btn-gold mt-10" onclick="handleLogin()">دخول ❤️</button>
        </div>
    </div>

    <!-- App Screen -->
    <div id="app-screen" class="screen hidden">
        
        <header class="app-header">
            <div class="header-title">
                <span>3MR ❤️ Roa</span>
            </div>
            <div>
                <button class="icon-btn" onclick="handleLogout()" title="خروج">🚪</button>
            </div>
        </header>

        <nav class="app-tabs">
            <div class="tab-item active" onclick="switchTab('chat-view', this)">
                💬 المحادثة
            </div>
            <div class="tab-item" onclick="switchTab('stories-view', this)">
                📖 الحالات
            </div>
            <div class="tab-item" onclick="switchTab('members-view', this)">
                👑 التحكم والملف
            </div>
        </nav>

        <main class="app-views">
            
            <!-- Chat View -->
            <section id="chat-view" class="view-content active">
                <div class="chat-messages" id="chat-messages-container"></div>

                <div class="chat-controls-area">
                    <div class="typing-indicator-bar" id="typing-indicator"></div>
                    
                    <div class="reply-preview-box" id="reply-preview">
                        <span class="text" id="reply-preview-text">رد على...</span>
                        <span style="color:var(--bright-red); cursor:pointer;" onclick="cancelReply()">✕</span>
                    </div>

                    <div class="chat-input-row">
                        <button class="attach-btn" onclick="triggerChatImageUpload()">📷</button>
                        <input type="file" id="chat-image-input" accept="image/*" style="display:none;" onchange="handleChatImageUpload(this)">
                        
                        <input type="text" id="chat-input-field" placeholder="اكتب رسالتك..." oninput="handleTypingEvent()" onkeydown="if(event.key==='Enter') sendChatMessage()">
                        
                        <button class="send-btn" onclick="sendChatMessage()">❤️</button>
                    </div>
                </div>
            </section>

            <!-- Stories View -->
            <section id="stories-view" class="view-content">
                <div class="story-actions-bar">
                    <div class="story-create-btn" onclick="createStoryText()">📝 نشر حالة نصية</div>
                    <div class="story-create-btn" onclick="triggerStoryImageUpload()">🖼️ نشر صورة</div>
                    <input type="file" id="story-image-input" accept="image/*" style="display:none;" onchange="handleStoryImageUpload(this)">
                </div>
                
                <div class="stories-list" id="stories-list-container"></div>
            </section>

            <!-- Profile & Admin View -->
            <section id="members-view" class="view-content">
                <div class="profile-card">
                    <div class="profile-avatar-container" onclick="triggerProfileAvatarChange()">
                        <img id="my-profile-img" src="" class="profile-avatar-img">
                    </div>
                    <input type="file" id="profile-avatar-file-input" accept="image/*" style="display:none;" onchange="handleProfileAvatarUpload(this)">

                    <div class="profile-name" id="my-profile-name">--</div>
                    <div id="my-profile-badge-container"></div>
                    <div style="font-size:0.85rem; color:var(--rose-gold); margin-top:4px;" id="my-profile-role">--</div>
                </div>

                <div id="admin-panel-container"></div>

                <h3 style="color:var(--gold); font-size:0.9rem; margin-bottom:10px;">الأعضاء المتواجدون</h3>
                <div id="users-list-container"></div>
            </section>

        </main>

        <footer class="marquee-footer">
            <div class="marquee-content">
                روءا قلبي اللي بعشقها ❤️ • روءا قلبي اللي بعشقها ❤️ • روءا قلبي اللي بعشقها ❤️
            </div>
        </footer>

    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://rewaa2lby-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('3mr_roa_session')) || null;
        let selectedReplyMsg = null;
        let typingTimeout = null;

        const DEFAULT_AVATARS = {
            '3MR': 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80',
            'Roa': 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80'
        };

        function initHeartsCanvas() {
            const canvas = document.getElementById('hearts-canvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const hearts = Array.from({ length: 10 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 8 + 4,
                speedY: Math.random() * 0.5 + 0.2,
                opacity: Math.random() * 0.4 + 0.2
            }));

            function drawHeart(x, y, size, color) {
                ctx.save(); ctx.beginPath(); ctx.translate(x, y); ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-size / 2, -size / 2, -size, size / 3, 0, size);
                ctx.bezierCurveTo(size, size / 3, size / 2, -size / 2, 0, 0);
                ctx.fillStyle = color; ctx.fill(); ctx.restore();
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                hearts.forEach(h => {
                    h.y -= h.speedY;
                    if (h.y < -20) h.y = height + 20;
                    drawHeart(h.x, h.y, h.size, `rgba(212, 175, 55, ${h.opacity})`);
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initHeartsCanvas();
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
                if (currentUser) {
                    launchMainApp();
                } else {
                    document.getElementById('login-screen').classList.remove('hidden');
                }
            }, 600);
        });

        function handleLogin() {
            const u = document.getElementById('login-username').value.trim();
            const c = document.getElementById('login-code').value.trim();

            if (!u || !c) return alert('أدخل البيانات!');

            if (u === '3MR' && c === '772009') {
                currentUser = { username: '3MR', role: 'المالك والآدمن 👑', isAdmin: true };
            } else if (u === 'Roa' && c === '15102009') {
                currentUser = { username: 'Roa', role: 'قلب القائد ❤️', isAdmin: false };
            } else {
                return alert('بيانات غير صحيحة!');
            }

            localStorage.setItem('3mr_roa_session', JSON.stringify(currentUser));
            document.getElementById('login-screen').classList.add('hidden');
            launchMainApp();
        }

        function handleLogout() {
            localStorage.removeItem('3mr_roa_session');
            location.reload();
        }

        function launchMainApp() {
            document.getElementById('app-screen').classList.remove('hidden');
            
            db.ref(`users/${currentUser.username}`).update({
                username: currentUser.username,
                role: currentUser.role,
                status: 'online'
            });

            db.ref(`users/${currentUser.username}/status`).onDisconnect().set('offline');

            db.ref(`users/${currentUser.username}/avatar`).on('value', snap => {
                const url = snap.val() || DEFAULT_AVATARS[currentUser.username] || DEFAULT_AVATARS['3MR'];
                currentUser.avatar = url;
                document.getElementById('my-profile-img').src = url;
            });

            document.getElementById('my-profile-name').innerText = currentUser.username;
            document.getElementById('my-profile-role').innerText = currentUser.role;
            document.getElementById('my-profile-badge-container').innerHTML = `<div class="golden-crown-badge">${currentUser.isAdmin ? '👑 أدمن' : '❤️ عضو مميز'}</div>`;

            if (currentUser.isAdmin) {
                document.getElementById('admin-panel-container').innerHTML = `
                    <div class="admin-box">
                        <h4>⚙️ لوحة تحكم الأدمن</h4>
                        <button class="btn btn-gold" onclick="clearAllChatMessages()">مسح كل المحادثات 🗑️</button>
                    </div>
                `;
            }

            initListeners();
        }

        function initListeners() {
            // Typing Indicator
            db.ref('typing').on('value', snap => {
                const data = snap.val() || {};
                const indicator = document.getElementById('typing-indicator');
                let txt = '';
                Object.keys(data).forEach(u => {
                    if (u !== currentUser.username && (Date.now() - data[u].timestamp < 3000)) {
                        txt = `${u} يكتب الآن... ❤️`;
                    }
                });
                indicator.innerText = txt;
            });

            // INSTANT MESSAGING MECHANISM (child_added)
            const chatContainer = document.getElementById('chat-messages-container');
            
            db.ref('messages').limitToLast(50).on('child_added', snap => {
                const m = snap.val();
                const key = snap.key;
                if (!m) return;

                const isMe = m.sender === currentUser.username;
                const timeStr = new Date(m.timestamp || Date.now()).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                const wrapper = document.createElement('div');
                wrapper.className = `msg-wrapper ${isMe ? 'me' : 'them'}`;
                wrapper.id = `msg-${key}`;

                let quoteHtml = m.replyTo ? `<div class="msg-quote"><b>${m.replyTo.sender}:</b> ${m.replyTo.text}</div>` : '';
                let imgHtml = m.image ? `<img src="${m.image}" class="msg-img">` : '';

                wrapper.innerHTML = `
                    <div class="msg-header">
                        <img src="${m.avatar}" class="msg-avatar">
                        <span>${m.sender}</span>
                    </div>
                    <div class="msg-bubble" onclick="setReplyTarget('${m.sender}', '${m.text || 'صورة'}')">
                        ${quoteHtml}
                        <div>${m.text || ''}</div>
                        ${imgHtml}
                    </div>
                    <div class="msg-footer">
                        <span>${timeStr}</span>
                    </div>
                `;
                chatContainer.appendChild(wrapper);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });

            // Handle Chat Cleared Event
            db.ref('messages').on('child_removed', snap => {
                const el = document.getElementById(`msg-${snap.key}`);
                if (el) el.remove();
            });

            // Stories Listener
            db.ref('stories').on('value', snap => {
                const container = document.getElementById('stories-list-container');
                container.innerHTML = '';
                const stories = snap.val() || {};

                const keys = Object.keys(stories).reverse();
                if (keys.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:0.85rem; padding: 20px;">لا توجد حالات حالياً.</div>';
                    return;
                }

                keys.forEach(key => {
                    const s = stories[key];
                    const timeStr = new Date(s.timestamp || Date.now()).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                    const card = document.createElement('div');
                    card.className = 'story-card';

                    let mediaHtml = s.image ? `<img src="${s.image}" class="story-media">` : '';
                    let deleteBtn = (currentUser.isAdmin || currentUser.username === s.username) ? `<button class="delete-btn" onclick="deleteStory('${key}')">حذف</button>` : '';

                    card.innerHTML = `
                        <div class="story-header">
                            <img src="${s.avatar || DEFAULT_AVATARS[s.username]}" class="story-avatar">
                            <span class="story-author">${s.username}</span>
                            ${deleteBtn}
                            <span class="story-time">${timeStr}</span>
                        </div>
                        <div class="story-body">${s.text || ''}</div>
                        ${mediaHtml}
                    `;
                    container.appendChild(card);
                });
            });

            // Users Status
            db.ref('users').on('value', snap => {
                const container = document.getElementById('users-list-container');
                container.innerHTML = '';
                const users = snap.val() || {};
                Object.keys(users).forEach(u => {
                    const usr = users[u];
                    const isOnline = usr.status === 'online';
                    const card = document.createElement('div');
                    card.className = 'user-card-item';
                    card.innerHTML = `
                        <div class="flex-row">
                            <img src="${usr.avatar || DEFAULT_AVATARS[u]}" style="width:32px; height:32px; border-radius:50%; border:1px solid var(--gold);">
                            <div>
                                <div style="font-weight:bold; font-size:0.85rem;">${usr.username}</div>
                            </div>
                        </div>
                        <div class="flex-row">
                            <span class="${isOnline ? 'online-dot' : 'offline-dot'}"></span>
                            <span style="font-size:0.75rem; color:var(--text-sub);">${isOnline ? 'متصل' : 'غير متصل'}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function handleTypingEvent() {
            db.ref(`typing/${currentUser.username}`).set({ timestamp: firebase.database.ServerValue.TIMESTAMP });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { db.ref(`typing/${currentUser.username}`).remove(); }, 1500);
        }

        function sendChatMessage(imageUrl = null) {
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();

            if (!text && !imageUrl) return;

            const msgObj = {
                sender: currentUser.username,
                avatar: currentUser.avatar || DEFAULT_AVATARS[currentUser.username],
                text: text || '',
                image: imageUrl || null,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            if (selectedReplyMsg) {
                msgObj.replyTo = { sender: selectedReplyMsg.sender, text: selectedReplyMsg.text };
            }

            input.value = '';
            cancelReply();
            db.ref(`typing/${currentUser.username}`).remove();

            // Push message instantly
            db.ref('messages').push(msgObj);
        }

        function setReplyTarget(sender, text) {
            selectedReplyMsg = { sender, text };
            document.getElementById('reply-preview-text').innerText = `رد على ${sender}: "${text}"`;
            document.getElementById('reply-preview').style.display = 'flex';
        }

        function cancelReply() {
            selectedReplyMsg = null;
            document.getElementById('reply-preview').style.display = 'none';
        }

        function triggerChatImageUpload() { document.getElementById('chat-image-input').click(); }
        function handleChatImageUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => compressAndSendImage(e.target.result, url => sendChatMessage(url));
                reader.readAsDataURL(input.files[0]);
            }
        }

        /* Stories Functions */
        function createStoryText() {
            const txt = prompt('اكتب نص الحالة:');
            if (txt && txt.trim()) {
                db.ref('stories').push({
                    username: currentUser.username,
                    avatar: currentUser.avatar || DEFAULT_AVATARS[currentUser.username],
                    text: txt.trim(),
                    image: null,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }

        function triggerStoryImageUpload() { document.getElementById('story-image-input').click(); }
        function handleStoryImageUpload(input) {
            if (input.files && input.files[0]) {
                const txt = prompt('اكتب تعليق على الصورة (اختياري):') || '';
                const reader = new FileReader();
                reader.onload = e => {
                    compressAndSendImage(e.target.result, url => {
                        db.ref('stories').push({
                            username: currentUser.username,
                            avatar: currentUser.avatar || DEFAULT_AVATARS[currentUser.username],
                            text: txt,
                            image: url,
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        });
                    });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function deleteStory(storyId) {
            if(confirm('هل تريد حذف هذه الحالة؟')) {
                db.ref(`stories/${storyId}`).remove();
            }
        }

        /* Fast Image Compressor */
        function compressAndSendImage(base64Str, callback) {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxDim = 500;

                if (width > height && width > maxDim) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                } else if (height > maxDim) {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.5));
            };
        }

        function triggerProfileAvatarChange() { document.getElementById('profile-avatar-file-input').click(); }
        function handleProfileAvatarUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    compressAndSendImage(e.target.result, url => {
                        db.ref(`users/${currentUser.username}/avatar`).set(url);
                    });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearAllChatMessages() {
            if (confirm('هل أنت تأكد من مسح جميع الرسائل؟')) {
                db.ref('messages').remove();
                document.getElementById('chat-messages-container').innerHTML = '';
            }
        }

        function switchTab(viewId, tabEl) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));

            tabEl.classList.add('active');
            document.getElementById(viewId).classList.add('active');
        }
    </script>
</body>
</html>
